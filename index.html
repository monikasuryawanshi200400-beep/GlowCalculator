
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowCalc - Smart Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background-glow"></div>

  <main class="calculator">
    <header class="header">
      <div>
        <h1>Glow<span>Calc.</span></h1>
        <p>Smart & Simple Calculator</p>
      </div>
      <div class="logo">✦</div>
    </header>

    <section class="display">
      <div id="expression" class="expression">0</div>
      <div id="result" class="result">0</div>
      <div class="display-label">RESULT</div>
    </section>

    <section class="buttons">
      <button class="special" data-action="clear">AC</button>
      <button class="special" data-action="delete">DEL</button>
      <button class="special" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="special" data-action="sign">+/−</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equal" data-action="calculate">=</button>
    </section>

    <footer>
      <span>✦ Designed with creativity</span>
      <span>Keyboard Supported</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
